spring:
  application:
    name: agent-platform-executor-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  execution:
    max-concurrent: 5
    default-timeout-seconds: 60
  claude:
    cli-path: claude

logging:
  level:
    com.agentplatform: DEBUG
