server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: agent-platform-test
  # Thymeleaf配置
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  # SQL初始化（自动加载H2兼容schema）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init_schema.sql
  # 数据源配置（H2内存数据库）
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # H2控制台（调试用）
  h2:
    console:
      enabled: true
      path: /h2-console
  # 异步任务配置
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 50
        thread-name-prefix: test-execution-pool-
    scheduling:
      pool:
        size: 2
      thread-name-prefix: test-scheduler-pool-

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 应用自定义配置
app:
  data-dir: ./test-data
  db-name: test-agent-platform.db
  # 任务执行配置
  execution:
    max-concurrent: 5
    default-timeout-seconds: 60
    queue-capacity: 50
  # 调度配置
  scheduler:
    enabled: false
    cleanup-days: 7
  # Claude CLI配置
  claude:
    cli-path: claude
    check-interval-minutes: 1

# 日志配置
logging:
  level:
    com.agentplatform: DEBUG
    org.springframework.scheduling: WARN
  file:
    name: ./test-logs/agent-platform-test.log

# Actuator健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
