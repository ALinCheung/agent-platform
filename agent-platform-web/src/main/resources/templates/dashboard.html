<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Agent Platform - 仪表盘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 min-w-[1280px]" x-data="dashboard()" x-init="init()">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="/" class="text-xl font-bold text-indigo-600">Agent Platform</a>
                    <a href="/" class="text-indigo-600 border-b-2 border-indigo-600 px-3 py-2 text-sm font-medium">仪表盘</a>
                    <a href="/tasks" class="text-gray-700 hover:text-indigo-600 px-3 py-2 text-sm font-medium">任务管理</a>
                    <a href="/executions" class="text-gray-700 hover:text-indigo-600 px-3 py-2 text-sm font-medium">执行监控</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">仪表盘</h1>

        <!-- 统计卡片 -->
        <div class="grid grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm font-medium text-gray-500">任务总数</div>
                <div class="mt-1 text-3xl font-semibold text-gray-900" x-text="overview.tasks?.total || 0"></div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm font-medium text-gray-500">已启用</div>
                <div class="mt-1 text-3xl font-semibold text-green-600" x-text="overview.tasks?.enabled || 0"></div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm font-medium text-gray-500">今日执行</div>
                <div class="mt-1 text-3xl font-semibold text-blue-600" x-text="overview.today?.total || 0"></div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-sm font-medium text-gray-500">成功率</div>
                <div class="mt-1 text-3xl font-semibold text-indigo-600" x-text="successRate + '%'"></div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="grid grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">最近7天执行趋势</h3>
                <canvas id="trendChart" height="200"></canvas>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">任务触发类型分布</h3>
                <canvas id="triggerChart" height="200"></canvas>
            </div>
        </div>

        <!-- TOP榜 -->
        <div class="grid grid-cols-2 gap-6">
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">失败任务TOP榜</h3>
                <div class="space-y-3">
                    <template x-for="item in topFailed" :key="item.name">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-700" x-text="item.name"></span>
                            <span class="text-sm font-medium text-red-600" x-text="item.failureCount + ' 次'"></span>
                        </div>
                    </template>
                    <div x-show="topFailed.length === 0" class="text-sm text-gray-500">暂无数据</div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">耗时任务TOP榜</h3>
                <div class="space-y-3">
                    <template x-for="item in topSlow" :key="item.name">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-700" x-text="item.name"></span>
                            <span class="text-sm font-medium text-orange-600" x-text="formatDuration(item.avgDuration)"></span>
                        </div>
                    </template>
                    <div x-show="topSlow.length === 0" class="text-sm text-gray-500">暂无数据</div>
                </div>
            </div>
        </div>
    </main>

    <script>
    function dashboard() {
        return {
            overview: {},
            topFailed: [],
            topSlow: [],
            history: [],
            triggerStats: [],

            get successRate() {
                const today = this.overview.today || {};
                if (!today.total) return 0;
                return ((today.success || 0) / today.total * 100).toFixed(1);
            },

            async init() {
                await Promise.all([
                    this.loadOverview(),
                    this.loadHistory(),
                    this.loadPerformance(),
                    this.loadTriggerStats()
                ]);
                this.renderCharts();
            },

            async loadOverview() {
                const res = await fetch('/api/stats/overview');
                this.overview = await res.json();
            },

            async loadHistory() {
                const res = await fetch('/api/stats/history?days=7');
                this.history = await res.json();
            },

            async loadPerformance() {
                const res = await fetch('/api/stats/performance');
                const data = await res.json();
                this.topFailed = data.topFailed || [];
                this.topSlow = data.topSlow || [];
            },

            async loadTriggerStats() {
                const res = await fetch('/api/stats/tasks');
                const data = await res.json();
                this.triggerStats = data.triggerType || [];
            },

            renderCharts() {
                // 趋势图
                new Chart(document.getElementById('trendChart'), {
                    type: 'line',
                    data: {
                        labels: this.history.map(d => d.date),
                        datasets: [
                            {
                                label: '成功',
                                data: this.history.map(d => d.success),
                                borderColor: '#10B981',
                                tension: 0.1
                            },
                            {
                                label: '失败',
                                data: this.history.map(d => d.failed),
                                borderColor: '#EF4444',
                                tension: 0.1
                            }
                        ]
                    },
                    options: { responsive: true }
                });

                // 触发类型分布图
                new Chart(document.getElementById('triggerChart'), {
                    type: 'doughnut',
                    data: {
                        labels: this.triggerStats.map(d => d.triggerType),
                        datasets: [{
                            data: this.triggerStats.map(d => d.count),
                            backgroundColor: ['#6366F1', '#10B981', '#F59E0B']
                        }]
                    },
                    options: { responsive: true }
                });
            },

            formatDuration(ms) {
                if (!ms) return '-';
                if (ms < 1000) return ms + 'ms';
                return (ms / 1000).toFixed(1) + 's';
            }
        };
    }
    </script>
</body>
</html>
