<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 侧边栏导航片段 - Dark OLED 科技风格 -->
<aside th:fragment="nav(currentPage)" class="sidebar" id="sidebar"
       x-data="{ collapsed: window.innerWidth < 768 }"
       :class="{ 'collapsed': collapsed }">
    <!-- Logo -->
    <div class="sidebar-logo">
        <span x-show="!collapsed">AGENT<span class="glow-sm"> PLATFORM</span></span>
        <span x-show="collapsed" class="glow-sm">AP</span>
    </div>

    <!-- 折叠按钮 -->
    <button @click="collapsed = !collapsed"
            class="absolute top-4 right-[-12px] w-6 h-6 rounded-full bg-[var(--color-bg-card)] border border-[var(--color-border)] flex items-center justify-center text-[var(--color-text-muted)] hover:text-[var(--color-accent)] hover:border-[var(--color-accent)] transition-colors z-50"
            style="font-size: 10px;">
        <span x-text="collapsed ? '»' : '«'"></span>
    </button>

    <!-- 导航链接 -->
    <nav class="sidebar-nav">
        <a href="/" class="sidebar-link" th:classappend="${currentPage == 'dashboard'} ? 'active'">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
            <span x-show="!collapsed">仪表盘</span>
        </a>
        <a href="/tasks" class="sidebar-link" th:classappend="${currentPage == 'tasks'} ? 'active'">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
            </svg>
            <span x-show="!collapsed">任务管理</span>
        </a>
        <a href="/executions" class="sidebar-link" th:classappend="${currentPage == 'executions'} ? 'active'">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span x-show="!collapsed">执行监控</span>
        </a>
    </nav>

    <!-- 底部信息 -->
    <div class="p-4 border-t border-[var(--color-border)]" x-show="!collapsed">
        <div class="text-xs text-[var(--color-text-muted)]">AI 自动化任务平台</div>
    </div>
</aside>
</html>
