<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Agent Platform - 任务管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 min-w-[1280px]" x-data="tasks()" x-init="init()">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="/" class="text-xl font-bold text-indigo-600">Agent Platform</a>
                    <a href="/" class="text-gray-700 hover:text-indigo-600 px-3 py-2 text-sm font-medium">仪表盘</a>
                    <a href="/tasks" class="text-indigo-600 border-b-2 border-indigo-600 px-3 py-2 text-sm font-medium">任务管理</a>
                    <a href="/executions" class="text-gray-700 hover:text-indigo-600 px-3 py-2 text-sm font-medium">执行监控</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">任务管理</h1>
            <button @click="showCreateModal = true"
                    class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 text-sm font-medium">
                新建任务
            </button>
        </div>

        <!-- 任务列表 -->
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">名称</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">触发类型</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">最近执行</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">成功率</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">操作</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <template x-for="task in tasks" :key="task.id">
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm font-medium text-gray-900" x-text="task.name"></div>
                                <div class="text-sm text-gray-500" x-text="task.description"></div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                      :class="{
                                          'bg-blue-100 text-blue-800': task.triggerType === 'CRON',
                                          'bg-green-100 text-green-800': task.triggerType === 'WEBHOOK',
                                          'bg-yellow-100 text-yellow-800': task.triggerType === 'EVENT'
                                      }"
                                      x-text="task.triggerType">
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                      :class="task.enabled ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'"
                                      x-text="task.enabled ? '已启用' : '已禁用'">
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                                x-text="task.lastExecutionAt || '-'"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"
                                x-text="getSuccessRate(task)"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                                <button @click="executeTask(task.id)" class="text-indigo-600 hover:text-indigo-900">执行</button>
                                <button @click="editTask(task)" class="text-gray-600 hover:text-gray-900">编辑</button>
                                <button @click="toggleTask(task)"
                                        :class="task.enabled ? 'text-red-600 hover:text-red-900' : 'text-green-600 hover:text-green-900'"
                                        x-text="task.enabled ? '禁用' : '启用'"></button>
                                <button @click="deleteTask(task.id)" class="text-red-600 hover:text-red-900">删除</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- 创建/编辑模态框 -->
        <div x-show="showCreateModal || showEditModal" x-cloak
             class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
            <div class="relative top-20 mx-auto p-5 border w-[600px] shadow-lg rounded-md bg-white">
                <h3 class="text-lg font-medium text-gray-900 mb-4"
                    x-text="showEditModal ? '编辑任务' : '新建任务'"></h3>
                <form @submit.prevent="showEditModal ? updateTask() : createTask()">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">任务名称</label>
                            <input x-model="form.name" type="text" required
                                   class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">命令</label>
                            <textarea x-model="form.command" rows="3" required
                                      class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-sm"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">触发类型</label>
                            <select x-model="form.triggerType" required
                                    class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                                <option value="CRON">Cron定时</option>
                                <option value="WEBHOOK">Webhook</option>
                                <option value="EVENT">事件</option>
                            </select>
                        </div>
                        <div x-show="form.triggerType === 'CRON'">
                            <label class="block text-sm font-medium text-gray-700">Cron表达式</label>
                            <input x-model="form.cronExpression" type="text"
                                   class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-sm"
                                   placeholder="0 9 * * *">
                        </div>
                        <div x-show="form.triggerType === 'WEBHOOK'">
                            <label class="block text-sm font-medium text-gray-700">Webhook路径</label>
                            <input x-model="form.webhookPath" type="text"
                                   class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">超时时间(秒)</label>
                                <input x-model.number="form.timeoutSeconds" type="number" min="60" max="3600"
                                       class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">最大重试次数</label>
                                <input x-model.number="form.maxRetries" type="number" min="0" max="10"
                                       class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                            </div>
                        </div>
                    </div>
                    <div class="mt-6 flex justify-end space-x-3">
                        <button type="button" @click="closeModal()"
                                class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200">
                            取消
                        </button>
                        <button type="submit"
                                class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700">
                            保存
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
    function tasks() {
        return {
            tasks: [],
            showCreateModal: false,
            showEditModal: false,
            form: { name: '', command: '', triggerType: 'CRON', cronExpression: '', webhookPath: '', timeoutSeconds: 300, maxRetries: 0 },
            editingId: null,

            async init() {
                await this.loadTasks();
            },

            async loadTasks() {
                const res = await fetch('/api/tasks');
                this.tasks = await res.json();
            },

            getSuccessRate(task) {
                const total = (task.successCount || 0) + (task.failureCount || 0);
                if (total === 0) return '-';
                return ((task.successCount || 0) / total * 100).toFixed(1) + '%';
            },

            async createTask() {
                const res = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                });
                if (res.ok) {
                    this.closeModal();
                    await this.loadTasks();
                } else {
                    const err = await res.json();
                    alert(err.errors ? err.errors.join('\n') : '创建失败');
                }
            },

            editTask(task) {
                this.editingId = task.id;
                this.form = { ...task };
                this.showEditModal = true;
            },

            async updateTask() {
                const res = await fetch('/api/tasks/' + this.editingId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                });
                if (res.ok) {
                    this.closeModal();
                    await this.loadTasks();
                }
            },

            async deleteTask(id) {
                if (!confirm('确定删除此任务？')) return;
                await fetch('/api/tasks/' + id, { method: 'DELETE' });
                await this.loadTasks();
            },

            async toggleTask(task) {
                const action = task.enabled ? 'disable' : 'enable';
                await fetch('/api/tasks/' + task.id + '/' + action, { method: 'POST' });
                await this.loadTasks();
            },

            async executeTask(id) {
                const res = await fetch('/api/tasks/' + id + '/execute', { method: 'POST' });
                if (res.ok) {
                    alert('任务已提交执行');
                }
            },

            closeModal() {
                this.showCreateModal = false;
                this.showEditModal = false;
                this.editingId = null;
                this.form = { name: '', command: '', triggerType: 'CRON', cronExpression: '', webhookPath: '', timeoutSeconds: 300, maxRetries: 0 };
            }
        };
    }
    </script>
</body>
</html>
