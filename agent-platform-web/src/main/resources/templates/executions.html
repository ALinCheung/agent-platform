<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Agent Platform - 执行监控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 min-w-[1280px]" x-data="executions()" x-init="init()">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="/" class="text-xl font-bold text-indigo-600">Agent Platform</a>
                    <a href="/" class="text-gray-700 hover:text-indigo-600 px-3 py-2 text-sm font-medium">仪表盘</a>
                    <a href="/tasks" class="text-gray-700 hover:text-indigo-600 px-3 py-2 text-sm font-medium">任务管理</a>
                    <a href="/executions" class="text-indigo-600 border-b-2 border-indigo-600 px-3 py-2 text-sm font-medium">执行监控</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">执行监控</h1>

        <!-- 执行记录列表 -->
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">任务ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">开始时间</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">耗时</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">重试次数</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">操作</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <template x-for="exec in executions" :key="exec.id">
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="exec.id"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="exec.taskId"></td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                      :class="{
                                          'bg-yellow-100 text-yellow-800': exec.status === 'RUNNING',
                                          'bg-green-100 text-green-800': exec.status === 'SUCCESS',
                                          'bg-red-100 text-red-800': exec.status === 'FAILED',
                                          'bg-orange-100 text-orange-800': exec.status === 'TIMEOUT',
                                          'bg-blue-100 text-blue-800': exec.status === 'RETRYING'
                                      }"
                                      x-text="exec.status">
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="exec.startedAt"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="formatDuration(exec.durationMs)"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="exec.retryCount"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                                <button @click="viewDetail(exec)" class="text-indigo-600 hover:text-indigo-900">详情</button>
                                <button x-show="exec.status === 'FAILED' || exec.status === 'TIMEOUT'"
                                        @click="retryExecution(exec.id)"
                                        class="text-green-600 hover:text-green-900">重试</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- 详情模态框 -->
        <div x-show="showDetail" x-cloak
             class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
            <div class="relative top-20 mx-auto p-5 border w-[700px] shadow-lg rounded-md bg-white">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-medium text-gray-900">执行详情</h3>
                    <button @click="showDetail = false" class="text-gray-400 hover:text-gray-600">&times;</button>
                </div>
                <div x-show="detail" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <div class="text-sm text-gray-500">状态</div>
                            <div class="text-sm font-medium" x-text="detail?.status"></div>
                        </div>
                        <div>
                            <div class="text-sm text-gray-500">退出码</div>
                            <div class="text-sm font-medium" x-text="detail?.exitCode ?? '-'"></div>
                        </div>
                        <div>
                            <div class="text-sm text-gray-500">开始时间</div>
                            <div class="text-sm font-medium" x-text="detail?.startedAt"></div>
                        </div>
                        <div>
                            <div class="text-sm text-gray-500">结束时间</div>
                            <div class="text-sm font-medium" x-text="detail?.finishedAt ?? '-'"></div>
                        </div>
                    </div>
                    <div>
                        <div class="text-sm text-gray-500 mb-1">输出</div>
                        <pre class="bg-gray-100 p-3 rounded text-xs overflow-auto max-h-48" x-text="detail?.output || '-'"></pre>
                    </div>
                    <div x-show="detail?.error">
                        <div class="text-sm text-red-500 mb-1">错误</div>
                        <pre class="bg-red-50 p-3 rounded text-xs overflow-auto max-h-48" x-text="detail?.error"></pre>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
    function executions() {
        return {
            executions: [],
            showDetail: false,
            detail: null,

            async init() {
                await this.loadExecutions();
            },

            async loadExecutions() {
                const res = await fetch('/api/executions');
                this.executions = await res.json();
            },

            async viewDetail(exec) {
                const res = await fetch('/api/executions/' + exec.id);
                this.detail = await res.json();
                this.showDetail = true;
            },

            async retryExecution(id) {
                if (!confirm('确定重试此执行？')) return;
                const res = await fetch('/api/executions/' + id + '/retry', { method: 'POST' });
                if (res.ok) {
                    alert('重试已提交');
                    await this.loadExecutions();
                }
            },

            formatDuration(ms) {
                if (!ms) return '-';
                if (ms < 1000) return ms + 'ms';
                return (ms / 1000).toFixed(1) + 's';
            }
        };
    }
    </script>
</body>
</html>
